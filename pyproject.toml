[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engineering"
version = "0.2.0"
description = "Auditable bounded software engineering graph with local OpenCode workers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional MCP server; the controller core stays dependency-free.
mcp = ["mcp>=2.3,<3", "uvicorn>=0.31"]

[project.scripts]
graph-engineering = "graph_engineering.cli:main"
graph-engineer = "graph_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_engineering = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/vendor/*.js", "web/vendor/*.txt"]
